# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-python3-webcomponents"
BBFILE_PATTERN_meta-python3-webcomponents = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-python3-webcomponents = "6"

LAYERDEPENDS_meta-python3-webcomponents = "core"
LAYERSERIES_COMPAT_meta-python3-webcomponents = "scarthgap"
